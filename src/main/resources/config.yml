enable-debug: false
enable-performance-debug: false
enable-version-checker: true
performance-debug:
  filter:
    mode: DISABLED
    operations:
    - loadItems.*
    - SortedItemsCache.*
date-format: dd/MM/yyyy HH:mm:ss
timezone: auto
storage-type: MYSQL
server-name: spawn1
database-configuration:
  table-prefix: ravenauctionv4_
  host: 172.18.0.1
  port: 3306
  user: u10_4RXUKnF6oS
  password: 'GTtVevN@7=G+spAwE3ajrCKx'
  database: s10_SMP_PLAYERS
  debug: false
message-colors:
- key: <primary>
  color: '#FF1F1F'
- key: <secondary>
  color: '#656665'
- key: <error>
  color: '#FF1F1F'
- key: <success>
  color: '#FF1F1F'
commands:
  main-command:
    aliases:
    - ah
    - hdv
    - auction
    - zauction
  sell:
    enable-sell-inventory: false
    aliases:
    - sell
    - s
    - vendre
    arguments:
    - name: price
      display-name: price
      required: true
      auto-completion:
      - 1000
      - 10000
      - 25000
    - name: amount
      display-name: amount
      required: false
      auto-completion:
      - '1'
      - '%max-stack-size%'
    - name: economy
      display-name: economy
      required: false
      auto-completion:
      - vault
  search:
    aliases:
    - search
    - s
    - rechercher
    arguments:
    - name: query
      display-name: query
      required: true
      auto-completion: []
  page:
    aliases:
    - page
    - p
    arguments:
    - name: page
      display-name: page
      required: true
      auto-completion:
      - '1'
      - '2'
      - '3'
      - '5'
      - '10'
  inventories:
  - enable: true
    permission: ravenauction.selling
    description: Open selling items
    aliases:
    - selling
    inventory: SELLING_ITEMS
  - enable: true
    permission: ravenauction.expired
    description: Open expired items
    aliases:
    - expired
    inventory: EXPIRED_ITEMS
  - enable: true
    permission: ravenauction.purchased
    description: Open purchased items
    aliases:
    - purchased
    inventory: PURCHASED_ITEMS
  - enable: true
    permission: ravenauction.history
    description: Open history
    aliases:
    - history
    inventory: HISTORY
  cooldown:
    default-cooldown: 100
    bypass-permission: ravenauction.cooldown.command.bypass
    per-command: {}
number-sell-multiplication:
  enable: true
  formats:
  - format: K
    multiplication: 1000
  - format: M
    multiplication: 1000000
  - format: B
    multiplication: 1000000000
  - format: T
    multiplication: 1000000000000
  - format: Q
    multiplication: 1000000000000000
  - format: QQ
    multiplication: 1000000000000000000
  - format: S
    multiplication: 1000000000000000000000
  - format: SS
    multiplication: 1000000000000000000000000
  - format: O
    multiplication: 1000000000000000000000000000
  - format: N
    multiplication: 1000000000000000000000000000000
  - format: D
    multiplication: 1000000000000000000000000000000000
  - format: UN
    multiplication: 1000000000000000000000000000000000000
  - format: DD
    multiplication: 1000000000000000000000000000000000000000
  - format: TR
    multiplication: 1000000000000000000000000000000000000000000

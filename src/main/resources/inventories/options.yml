################################################################################################################################
#
#   RavenAuction V4 - Player Options Inventory
#
#   This inventory allows players to toggle their personal preferences.
#   Currently supports broadcast notification opt-in/opt-out.
#
#   ACCESS:
#   - /ah option
#   - /ah options
#
#   Documentation: https://docs.groupez.dev/ravenauction/introduction
#   Discord: https://discord.groupez.dev/
#
################################################################################################################################

#=============================================================================
# INVENTORY SETTINGS
#=============================================================================

name: '#0c1719ᴏᴘᴛɪᴏɴs'
size: 27

#=============================================================================
# PATTERNS
#=============================================================================

patterns:
  - 'ravenauction-decoration'
  - 'ravenauction-back'

#=============================================================================
# ITEMS
#=============================================================================

items:

  #---------------------------------------------------------------------------
  # BROADCAST SELL TOGGLE
  #---------------------------------------------------------------------------

  broadcast-sell:
    type: ZAUCTIONHOUSE_OPTION_TOGGLE
    slot: 11
    option-name: broadcast_sell
    enable-text: '#55FF55ENABLED'
    disable-text: '#FF4D4DDISABLED'
    item:
      material: OAK_SIGN
      name: '#33FF66<bold>SELL BROADCASTS'
      lore:
        - '&fAnnouncements shown when players list items.'
        - ''
        - '#55FF55✔ #AAAAAAStatus: %option_status%'
        - ''
        - '#FFFF55▸ #FFFF55&nCLICK&r #55FF55to Toggle'

  #---------------------------------------------------------------------------
  # BROADCAST PURCHASE TOGGLE
  #---------------------------------------------------------------------------

  broadcast-purchase:
    type: ZAUCTIONHOUSE_OPTION_TOGGLE
    slot: 15
    option-name: broadcast_purchase
    enable-text: '#55FF55ENABLED'
    disable-text: '#FF4D4DDISABLED'
    item:
      material: GOLD_INGOT
      name: '#33FF66<bold>PURCHASE BROADCASTS'
      lore:
        - '&fAnnouncements shown when players buy items.'
        - ''
        - '#55FF55✔ #AAAAAAStatus: %option_status%'
        - ''
        - '#FFFF55▸ #FFFF55&nCLICK&r #55FF55to Toggle'

name: '&8Auction (%page%/%max-page%)'
size: 54
patterns:
- ravenauction-pagination
items:
  display-items:
    type: ZAUCTIONHOUSE_LISTED_ITEMS
    empty-slot: 22
    slots:
    - 0-44
    item:
      material: BARRIER
      name: '&r&#FF1F1FNo Items Found'
      lore:
      - ''
      - '&r&fThere are no listings matching'
      - '&r&fyour search right now.'
  sort:
    slot: 51
    type: ZAUCTIONHOUSE_CHANGE_SORT
    enable-text: '&r&#FF1F1F▪ %sorting%'
    disable-text: '&f▪ %sorting%'
    sorts:
    - DECREASING_DATE
    - ASCENDING_DATE
    - DECREASING_PRICE
    - ASCENDING_PRICE
    loading-item:
      material: CAULDRON
      name: '&r&#FF1F1FSort'
      lore:
      - ''
      - '&r&fUpdating auction listings.'
    item:
      material: CAULDRON
      name: '&r&#FF1F1FSort'
      lore:
      - ''
      - '&r&f%DECREASING_DATE%'
      - '&r&f%ASCENDING_DATE%'
      - '&r&f%DECREASING_PRICE%'
      - '&r&f%ASCENDING_PRICE%'
    sound: UI_BUTTON_CLICK
    pitch: 1.05
    volume: 0.35
  your-items:
    slot: 46
    type: INVENTORY
    plugin: RavenAuction
    inventory: combined-items
    is-permanent: true
    item:
      material: CHEST
      name: '&r&#FF1F1FYour Items'
      lore:
      - ''
      - '&r&fView, manage, and collect items'
      - '&r&ffrom your auction listings.'
    sound: UI_BUTTON_CLICK
    pitch: 1.05
    volume: 0.35
  search:
    slot: 47
    type: ZAUCTIONHOUSE_SEARCH
    is-permanent: true
    none-value: None
    active-value: 'true'
    inactive-value: 'false'
    item:
      material: OAK_SIGN
      name: '&r&#FF1F1FSearch'
      lore:
      - ''
      - '&r&fSearch listings by item name'
      - '&r&for material type.'
    sound: UI_BUTTON_CLICK
    pitch: 1.05
    volume: 0.35
  refresh:
    slot: 49
    type: ZAUCTIONHOUSE_REFRESH
    item:
      material: ANVIL
      name: '&r&#FF1F1FRefresh'
      lore:
      - ''
      - '&r&fRefresh the marketplace to view'
      - '&r&fthe latest available listings.'
    sound: UI_BUTTON_CLICK
    pitch: 1.05
    volume: 0.35
    loading-item:
      material: ANVIL
      name: '&r&#FF1F1FRefresh'
      lore:
      - ''
      - '&r&fUpdating auction listings.'
  filter:
    slot: 52
    type: ZAUCTIONHOUSE_CATEGORY_SWITCHER
    is-permanent: true
    enable-text: '&r&#FF1F1F▪ %category%'
    disable-text: '&f▪ %category%'
    categories:
    - main
    - raven-filter-blocks
    - raven-filter-tools
    - raven-filter-food
    - raven-filter-combat
    - raven-filter-potions
    - raven-filter-books
    - raven-filter-ingredients
    - raven-filter-utilities
    item:
      material: HOPPER
      name: '&r&#FF1F1FFilter'
      lore:
      - ''
      - '%main%'
      - '%raven-filter-blocks%'
      - '%raven-filter-tools%'
      - '%raven-filter-food%'
      - '%raven-filter-combat%'
      - '%raven-filter-potions%'
      - '%raven-filter-books%'
      - '%raven-filter-ingredients%'
      - '%raven-filter-utilities%'
    sound: UI_BUTTON_CLICK
    pitch: 1.05
    volume: 0.35

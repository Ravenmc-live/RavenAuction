name: '&8sELL ITEM'
size: 54
patterns:
- ravenauction-decoration
items:
  show-item:
    type: ZAUCTIONHOUSE_SELL_SHOW_ITEM
    slots:
    - 9-44
    empty-slot: 22
    item:
      material: BARRIER
      name: '&r&#FF1F1FNo Item Selected'
      lore:
      - ''
      - '&r&fHold An Item In Your Hand'
    sound: UI_BUTTON_CLICK
    pitch: 1.05
    volume: 0.35
  cancel:
    type: ZAUCTIONHOUSE_SELL_CANCEL
    slot: 45
    item:
      material: BARRIER
      name: '&r&#FF1F1FCancel'
      lore:
      - ''
      - '&r&fAbandon This Sale'
      - '&r&fItems Return To Your Inventory'
    sound: UI_BUTTON_CLICK
    pitch: 1.05
    volume: 0.35
  private-decrease:
    type: ZAUCTIONHOUSE_SELL_PRICE
    slot: 48
    amounts:
      left-click: -500
      right-click: -100
      shift-left-click: -1000
      shift-right-click: -2500
    item:
      material: RED_DYE
      name: '&r&#FF1F1FDecrease Price'
      lore:
      - ''
      - '&r&f» Current Price: %price%'
      - '&r&fShift+Left -1,000 | Shift+Right -2,500'
    sound: UI_BUTTON_CLICK
    pitch: 1.05
    volume: 0.35
  select-economy:
    type: ZAUCTIONHOUSE_SELL_ECONOMY
    slot: 49
    item:
      material: EMERALD
      name: '&r&#FF1F1FEconomy'
      lore:
      - ''
      - '&r&fSelected: %economy%'
    sound: UI_BUTTON_CLICK
    pitch: 1.05
    volume: 0.35
  price-increase:
    type: ZAUCTIONHOUSE_SELL_PRICE
    amounts:
      left-click: 500
      right-click: 100
      shift-left-click: 1000
      shift-right-click: 2500
    slot: 50
    item:
      material: LIME_DYE
      name: '&r&#FF1F1FIncrease Price'
      lore:
      - ''
      - '&r&fCurrent Price: %price%'
      - '&r&fShift+Left +1,000 | Shift+Right +2,500'
    sound: UI_BUTTON_CLICK
    pitch: 1.05
    volume: 0.35
  confirm:
    type: ZAUCTIONHOUSE_SELL_CONFIRM
    slot: 53
    item:
      material: EMERALD
      name: '&r&#FF1F1FConfirm Sale'
      lore:
      - ''
      - '&r&fPrice: %price% (%economy%)'
    sound: UI_BUTTON_CLICK
    pitch: 1.05
    volume: 0.35
